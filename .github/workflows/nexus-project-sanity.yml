name: Nexus project sanity

on:
  push:
    branches:
      - nexus/main
    paths:
      - 'docs/nexus/**'
      - 'AGENTS.md'
      - 'scripts/nexus/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/nexus-project-sanity.yml'
  pull_request:
    branches:
      - nexus/main
    paths:
      - 'docs/nexus/**'
      - 'AGENTS.md'
      - 'scripts/nexus/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/nexus-project-sanity.yml'

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify required Nexus documents
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            docs/nexus/README.md
            docs/nexus/VISION.md
            docs/nexus/ARCHITECTURE.md
            docs/nexus/adr/0002-convergent-aros-nexus-architecture.md
            docs/nexus/AI_FOUNDATIONS.md
            docs/nexus/UPSTREAM_INTEGRATION.md
            docs/nexus/CONVERGENT_ARCHITECTURE.md
            docs/nexus/CONVERGENCE_RISKS.md
            docs/nexus/ROADMAP.md
            docs/nexus/TRUST_MODEL.md
            docs/nexus/LEGACY_PRIVILEGE_MODEL.md
            docs/nexus/NEXUS_EXEC_SPLIT.md
            docs/nexus/ADDRESS_SPACE_MODEL.md
            docs/nexus/BASELINE.md
            docs/nexus/CI_STRATEGY.md
            docs/nexus/VERIFICATION_MODEL.md
            docs/nexus/REVIEW_PROTOCOL.md
            docs/nexus/GOVERNANCE.md
            docs/nexus/ABI_V1_COMPAT.md
            docs/nexus/BOOTSTRAP_MVP.md
            docs/nexus/TASKS.md
            .github/ISSUE_TEMPLATE/nexus_engineering_task.md
            .github/pull_request_template.md
            scripts/nexus/verify-agent-contract.sh
            scripts/nexus/verify-qemu-policy.sh
            scripts/nexus/baseline/README.md
            scripts/nexus/baseline/build-x86_64.sh
            scripts/nexus/baseline/run-qemu-x86_64.sh
            scripts/nexus/baseline/record-wanderer-result.sh
            scripts/nexus/baseline/selftest.sh
            .github/workflows/nexus-qemu.yml
          )
          for file in "${required[@]}"; do
            test -f "$file" || {
              echo "::error::Missing required Nexus document: $file"
              exit 1
            }
          done

      - name: Check local Markdown links in Nexus docs
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          root = Path("docs/nexus")
          link_re = re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)')
          failures = []

          for md in root.rglob("*.md"):
              text = md.read_text(encoding="utf-8")
              for target in link_re.findall(text):
                  target = target.strip()
                  if (
                      not target
                      or target.startswith("#")
                      or "://" in target
                      or target.startswith("mailto:")
                  ):
                      continue

                  path_part = target.split("#", 1)[0]
                  if not path_part:
                      continue

                  resolved = (md.parent / path_part).resolve()
                  try:
                      resolved.relative_to(Path.cwd().resolve())
                  except ValueError:
                      failures.append((md, target, "escapes repository"))
                      continue

                  if not resolved.exists():
                      failures.append((md, target, "target does not exist"))

          if failures:
              for source, target, reason in failures:
                  print(f"::error file={source}::{target}: {reason}")
              sys.exit(1)

          print("Nexus local Markdown links are valid.")

      - name: Check Nexus shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
          done < <(find scripts/nexus -type f -name '*.sh' -print0)

      - name: Run agent-contract adversarial self-test
        shell: bash
        run: |
          set -euo pipefail
          scripts/nexus/verify-agent-contract.sh --selftest

      - name: Run baseline harness self-test
        shell: bash
        run: |
          set -euo pipefail
          scripts/nexus/baseline/selftest.sh

      - name: Run parsimonious QEMU policy self-test
        shell: bash
        run: |
          set -euo pipefail
          scripts/nexus/verify-qemu-policy.sh --selftest

      - name: Check Nexus process references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'three distinct review' docs/nexus/REVIEW_PROTOCOL.md
          grep -q 'NO TEST, EXPLAIN WHY' AGENTS.md
          grep -q 'Evidence Red Team' docs/nexus/REVIEW_PROTOCOL.md
          grep -q 'H1 — mandatory human technical review' docs/nexus/VERIFICATION_MODEL.md
          grep -q 'No L1-L5 claim is accepted' AGENTS.md
          test "$(wc -l < AGENTS.md)" -le 300
          grep -q '## Acceptance criteria' .github/ISSUE_TEMPLATE/nexus_engineering_task.md
          grep -q '## Negative / red-team criteria' .github/ISSUE_TEMPLATE/nexus_engineering_task.md
          grep -q '## Review 3 test plan' .github/ISSUE_TEMPLATE/nexus_engineering_task.md
          grep -q '## Review 3 — Evidence Red Team' .github/pull_request_template.md
          grep -q 'NO TEST, EXPLAIN WHY' .github/pull_request_template.md
          grep -q '## Human / hardware gate' .github/pull_request_template.md
          grep -q 'Francesco Poltero' docs/nexus/GOVERNANCE.md
          grep -q 'info@francescopoltero.com' docs/nexus/GOVERNANCE.md
          grep -q '2edd46536d08e3b54ecd1315f337a9b7de896f3a' docs/nexus/BASELINE.md

name: Nexus x86-64 QEMU smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - nexus/main
    types:
      - opened
      - reopened
      - ready_for_review
    paths:
      - 'arch/x86_64-pc/**'
      - 'arch/all-pc/**'
      - 'rom/kernel/**'
      - 'rom/exec/**'
      - 'rom/dos/**'
      - 'rom/dosboot/**'
      - 'config/**'
      - 'scripts/azure/**'
      - 'scripts/nexus/baseline/**'
      - '.github/workflows/nexus-qemu.yml'

permissions:
  contents: read

concurrency:
  group: nexus-qemu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qemu-kernel-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BUILDTHREADS: '2'
      NEXUS_PROFILE: diagnostic
      NEXUS_QEMU_MODE: headless
      NEXUS_QEMU_MEMORY_MIB: '1024'
      NEXUS_QEMU_CPUS: '1'
      NEXUS_QEMU_TIMEOUT_SECONDS: '60'
      NEXUS_QEMU_EXPECT_MARKER: 'AROS64 - The AROS Research OS'

    steps:
      - name: Check out tested commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Record workflow identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Nexus QEMU G2a"
            echo
            echo "- Workflow SHA: \`${GITHUB_SHA}\`"
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "- PR: #${{ github.event.pull_request.number }}"
              echo "- PR head: \`${{ github.event.pull_request.head.sha }}\`"
              echo "- PR base: \`${{ github.event.pull_request.base.sha }}\`"
            fi
            echo "- Claim: early x86-64 kernel serial marker only"
            echo "- Marker: \`${NEXUS_QEMU_EXPECT_MARKER}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install AROS build dependencies and QEMU
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y \
            libpng-dev zlib1g-dev libxcursor-dev libgl1-mesa-dev libasound2-dev \
            gawk bison flex netpbm automake cmake genisoimage \
            python3-mako python3-yaml python3-distutils-extra \
            libswitch-perl gperf gcc-multilib g++ ccache libclang-dev \
            jlha-utils wget liblzma-dev mtools xorriso nasm \
            qemu-system-x86

      - name: Build diagnostic x86-64 baseline artifact
        id: build
        shell: bash
        env:
          NEXUS_WORK_ROOT: ${{ runner.temp }}/nexus-qemu
        run: |
          set -euo pipefail
          build_log="$RUNNER_TEMP/nexus-build.log"
          scripts/nexus/baseline/build-x86_64.sh 2>&1 | tee "$build_log"

          mapfile -t isos < <(
            find "$NEXUS_WORK_ROOT/runs" \
              -type f \
              -path '*/artifacts/aros-pc-x86_64.iso' \
              -print
          )

          if [ "${#isos[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one baseline ISO, found ${#isos[@]}"
            exit 1
          fi

          iso="${isos[0]}"
          artifact_dir="$(dirname -- "$iso")"

          echo "iso=$iso" >> "$GITHUB_OUTPUT"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "### G1 artifact"
            echo "- ISO SHA-256: \`$(sha256sum "$iso" | awk '{print $1}')\`"
            echo "- Build manifest: retained as short-lived evidence"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run bounded QEMU early-kernel marker smoke
        shell: bash
        run: |
          set -euo pipefail
          result_dir="$RUNNER_TEMP/nexus-qemu-result"

          scripts/nexus/baseline/run-qemu-x86_64.sh \
            "${{ steps.build.outputs.iso }}" \
            "$result_dir"

          grep -q '^FINAL_STATUS=marker-reached$' "$result_dir/run-manifest.txt"
          grep -q '^MARKER_REACHED_FINAL=yes$' "$result_dir/run-manifest.txt"
          grep -Fq -- "$NEXUS_QEMU_EXPECT_MARKER" "$result_dir/serial.log"

          {
            echo
            echo "### G2a result"
            echo "- Result: **PASS**"
            echo "- Evidence class: **E4 for this early-kernel marker only**"
            echo "- This does not prove Wanderer, SMP, isolation, DMA or real-hardware behavior."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload short-lived QEMU evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexus-qemu-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            ${{ runner.temp }}/nexus-build.log
            ${{ runner.temp }}/nexus-qemu-result/**
            ${{ runner.temp }}/nexus-qemu/runs/**/artifacts/build-manifest.txt
            ${{ runner.temp }}/nexus-qemu/runs/**/artifacts/submodules.txt
